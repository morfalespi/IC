name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.12"
            node: "22"
          - python: "3.13"
            node: "24"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run check
      - run: python -m pip install -r scripts/resolver-requirements.txt
      - run: python scripts/compatibility.py

      - run: python -m unittest discover -s tests -v
      - run: node --experimental-vm-modules tests/tgcloud.test.cjs
