name: IC - Execucao real da Bot API oficial

on:
  workflow_dispatch:
    inputs:
      confirmar_envio:
        description: "Confirmo o envio de mensagens e arquivos sinteticos ao chat de teste autorizado"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  observacao-real:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exigir autorizacao explicita
        env:
          CONFIRMO: ${{ inputs.confirmar_envio }}
        run: |
          if [ "$CONFIRMO" != "true" ]; then
            echo "::error::Envio real nao autorizado. Nenhum teste foi executado."
            exit 2
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-lock.txt
      - name: Instalar dependencias
        run: python -m pip install -r scripts/requirements-lock.txt
      - name: Observar chamadas reais e confrontar com referencia oficial
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          IC_TEST_CHAT_ID: ${{ secrets.IC_TEST_CHAT_ID }}
          IC_ALLOW_SYNTHETIC_DELIVERY: "yes"
        run: python tests/official_api_live.py
