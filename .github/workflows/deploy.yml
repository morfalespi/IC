name: Deploy (Telegram Serverless)

on:
  push:
    branches: [main]
    paths:
      - "tgcloud/**"
      - "tgcloud.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      migrate_mode:
        description: "Migração do banco: safe (só mudanças aditivas) ou dry-run (só mostra)."
        type: choice
        options: [safe, dry-run]
        default: safe

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar secret
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Defina o secret TGCLOUD_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - run: npm ci

      - run: npm run check

      - name: Validar configuração antes de alterar a nuvem
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate_mode != 'dry-run' }}
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          IC_DISPATCH_PRIVATE_KEY: ${{ secrets.IC_DISPATCH_PRIVATE_KEY }}
          IC_DISPATCH_PUBLIC_KEY: ${{ vars.IC_DISPATCH_PUBLIC_KEY }}
        run: |
          node <<'NODE'
          const { createPrivateKey, createPublicKey } = require('node:crypto');
          const required = {
            GH_DISPATCH_TOKEN: 'secret',
            BOT_TOKEN: 'secret',
            API_ID: 'secret',
            API_HASH: 'secret',
            IC_DISPATCH_PRIVATE_KEY: 'secret',
            IC_DISPATCH_PUBLIC_KEY: 'variable',
          };
          let failed = false;
          for (const [name, type] of Object.entries(required)) {
            if (!process.env[name]?.trim()) {
              console.error('::error::Configuração ausente: ' + name + ' (' + type + ').');
              failed = true;
            }
          }
          if (failed) process.exit(1);

          try {
            const jwk = JSON.parse(process.env.IC_DISPATCH_PUBLIC_KEY);
            if (!jwk || jwk.kty !== 'RSA' || typeof jwk.n !== 'string' ||
                typeof jwk.e !== 'string' || Object.hasOwn(jwk, 'd')) {
              throw new Error('JWK pública RSA inválida');
            }
            const pub = createPublicKey({ key: jwk, format: 'jwk' });
            const priv = createPrivateKey(process.env.IC_DISPATCH_PRIVATE_KEY);
            const derived = createPublicKey(priv).export({ format: 'jwk' });
            if (pub.asymmetricKeyDetails?.modulusLength < 2048 ||
                priv.asymmetricKeyType !== 'rsa' ||
                jwk.n !== derived.n || jwk.e !== derived.e) {
              throw new Error('Chaves não correspondentes ou insuficientes');
            }
          } catch {
            console.error('::error::IC_DISPATCH_PUBLIC_KEY (variable) e IC_DISPATCH_PRIVATE_KEY (secret) devem formar o mesmo par RSA de pelo menos 2048 bits.');
            failed = true;
          }

          if (failed) process.exit(1);
          console.log('Pré-validação concluída; nenhum segredo foi exibido.');
          NODE

      - name: Validar a permissão do GH_DISPATCH_TOKEN
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate_mode != 'dry-run' }}
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          status=$(curl -sS -m 20 -o "$RUNNER_TEMP/validacao.json" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main","inputs":{"healthcheck":true}}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/resolver.yml/dispatches")
          case "$status" in
            200|204)
              echo "GH_DISPATCH_TOKEN disparou o healthcheck do resolver.yml (HTTP $status)."
              ;;
            401|403|404|422)
              echo "::error::GH_DISPATCH_TOKEN não pode disparar o resolver.yml (HTTP $status). O token precisa da permissão Actions: Read and write neste repositório. A publicação foi interrompida antes de alterar o serviço."
              exit 1
              ;;
            *)
              echo "::error::Resposta inesperada do GitHub ao validar o token (HTTP $status)."
              exit 1
              ;;
          esac

      - name: Sincronizar estado da nuvem
        run: npx --no-install tgcloud fetch

      - name: Mudanças a publicar
        run: npx --no-install tgcloud status

      - name: Migrar banco
        run: |
          mode="${{ github.event.inputs.migrate_mode || 'safe' }}"
          case "$mode" in
            dry-run) npx --no-install tgcloud migrate --dry-run --local ;;
            safe)    npx --no-install tgcloud migrate --safe --local ;;
            *)       echo "::error::Modo de migração inválido"; exit 1 ;;
          esac

      - name: Injetar configuração privada no módulo do bot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate_mode != 'dry-run' }}
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          IC_DISPATCH_PUBLIC_KEY: ${{ vars.IC_DISPATCH_PUBLIC_KEY }}
        run: |
          if [ -z "$GH_DISPATCH_TOKEN" ]; then
            echo "::error::Defina o secret GH_DISPATCH_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const publicKey = JSON.parse(process.env.IC_DISPATCH_PUBLIC_KEY || 'null');
          if (!publicKey || publicKey.kty !== 'RSA' || !publicKey.n || !publicKey.e || publicKey.d) throw new Error('Configure uma chave pública de dispatch válida.');
          const conteudo = [
            `export const GH_DISPATCH_TOKEN = ${JSON.stringify(process.env.GH_DISPATCH_TOKEN)};`,
            `export const GH_REPOSITORY = ${JSON.stringify(process.env.GH_REPOSITORY)};`,
            `export const IC_DISPATCH_PUBLIC_KEY = ${JSON.stringify(publicKey)};`,
            '',
          ].join('\n');
          NODE

      - name: Publicar módulos
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate_mode != 'dry-run' }}
        run: npx --no-install tgcloud push

      - name: Estado do webhook
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate_mode != 'dry-run' }}
        run: npx --no-install tgcloud webhook

      - name: Confirmar prévia sem publicação
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_mode == 'dry-run' }}
        run: echo "Prévia concluída. Migração não aplicada, módulos não publicados e nenhum healthcheck disparado."
